name: CI

on:
  push:
    branches: [main]
    paths-ignore: &non_code_paths
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *non_code_paths

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - run: python scripts/check_coverage.py
      # Non-blocking: Codecov visibility shouldn't gate CI or the mutation
      # job below, especially before CODECOV_TOKEN is added as a repo secret.
      - uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  mutation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history so scripts/run_mutation_tests.py can diff against a
          # base ref (PR base, origin/main, or the previous commit) and scope
          # mutation testing to just the files that changed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/run_mutation_tests.py
