[project]
name = "mgsdelta-connector"
version = "0.1.0"
description = "Runtime bridge between a running Metal Gear Solid Delta process and an Archipelago server"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==9.0.3",  # 8.3.3 has CVE-2025-71176 (insecure tmpdir handling)
    "pytest-cov==5.0.0",
    "mutmut==3.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Archipelago is a vendored submodule (real core, needed for eventual
# CommonClient subclassing) -- not our code, don't lint/format it.
extend-exclude = ["Archipelago"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C90"]
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# Archipelago core (CommonClient/NetUtils/worlds) intentionally stays off
# mypy_path: pointing mypy at the submodule would make it follow imports
# into every bundled game world, which isn't our code and isn't mypy-clean
# (see mgsdelta-apworld's identical note). These two imports stay
# unresolved (-> Any) instead, and we only relax the one strict check that
# matters for subclassing an Any-typed external base.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["CommonClient", "NetUtils", "worlds"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# fail_under is deliberately NOT set here: pytest-cov's own fail-under check
# is flaky when total statements == 0 (nedbat/coveragepy#1470,
# pytest-dev/pytest-cov#641) — identical zero-logic input has been observed
# to report both 100% and 0%. scripts/check_coverage.py enforces the 100%
# gate deterministically instead, from coverage's own JSON totals.
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
paths_to_mutate = ["src/"]
runner = "python -m pytest -x -q"
